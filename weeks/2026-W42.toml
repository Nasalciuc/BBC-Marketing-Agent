body = '''
The world's best airline. For the sixth time.

Skytrax announced its 2026 World Airline Awards in London, after a year of surveys in which more than 24 million travellers rated over 300 airlines. Singapore Airlines was named the World's Best Airline for the sixth time, and the Best Airline in Asia.

The longest nonstop flight in the world, with the airline that does it best. And on this aircraft there is no economy class: sixty-seven business seats, and nothing below premium economy.

