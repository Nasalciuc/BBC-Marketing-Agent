body = "Tokyo turns gold at the end of November. This year, the forecast names the day.\n\nThe season's final forecast from the Japan Meteorological Corporation: the ginkgo at their peak in Tokyo on 29 November, the red maples on 30 November, a few days later than usual after a warm autumn. The avenue at Meiji Jingu Gaien: 300 metres of ginkgo on both sides. And Rikugien, a garden of some 560 autumn trees, open after dark from 25 November to 6 December. Kyoto follows: its maples are forecast for mid-December.\n\nThe peak is just over a fortnight away. One flight.\n\nBusiness class, New York to Tokyo. A flat bed on the way, and you land as the city turns."

