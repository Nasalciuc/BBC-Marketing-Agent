name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:                      # throwaway database for tests/test_content_system_pg.py
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CONTENT_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: playwright install chromium
      - uses: actions/setup-node@v4          # only to fetch the agent-browser binary for the publisher tests
        with:
          node-version: "24"
      - run: npm install -g agent-browser@0.41.1 --ignore-scripts
      - run: echo "AGENT_BROWSER_BIN=$(npm root -g)/agent-browser/bin/agent-browser-linux-x64" >> "$GITHUB_ENV"
      - run: python scripts/ensure_default_background.py
      - run: pytest tests -q
      - run: ruff check .
