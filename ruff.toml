# Lint rules live here, and ruff itself is pinned in requirements.txt: newer ruff versions
# changed the default rule set and turned CI red from 27 Jul 2026 without a code change.
target-version = "py312"
line-length = 100
extend-exclude = ["graphify-out", "output", "scripts"]

[lint]
select = ["E4", "E7", "E9", "F"]
